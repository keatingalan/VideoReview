<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preload" href="/DMSans-VariableFont_opsz,wght.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/MediaInfoModule.wasm" as="fetch" type="application/wasm" crossorigin>
	<title>Competition Videos</title>

    <style>
        @font-face {
			font-family: "DM Sans";
			src: url('/DMSans-VariableFont_opsz,wght.ttf') format("truetype-variations");
		}
	    body {
			font-family:"DM Sans", sans-serif; 
			background-color: rgb(233, 233, 233);
		}
		
		div#clock {font-size:85%; text-align:center;}
        table {
            width: 100%;
            min-height: 10em;
            /*max-height: 55vh;*/
            overflow-y: scroll;
            overflow-x: ellipsis;
            vertical-align: top;
        }
        td#logcolumn {width: 40vw;min-width:30em;max-height: 30em;}
        table#table {font-size: 60%;}
        /* ── Tabbed panel ── */
        .tab-panel {
            flex: 1 1 68%;
            min-width: 300px;
            display: flex;
            flex-direction: column;
        }
        .tab-bar {
            display: flex;
            gap: 0;
            border-bottom: 2px solid #444;
        }
        .tab-btn {
            padding: 6px 18px;
            border: none;
            border-bottom: none;
            background: #ccc;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95em;
            border-radius: 6px 6px 0 0;
            margin-right: 3px;
            color: #333;
        }
        .tab-btn.active {
            background: #444;
            color: #fff;
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: flex; flex-direction: column; }

        /* video pane */
        #pane-video {
            position: relative;
        }
        #pane-video video {
            width: 100%;
            height: 50vh;
            min-height: 150px;
            background: darkgrey;
            display: block;
        }
        #pane-video:fullscreen video,
        #pane-video:-webkit-full-screen video {
            width: 100%;
            height: 100%;
            min-height: 0;
        }
        #pane-video:fullscreen #video-controls-bar,
        #pane-video:-webkit-full-screen #video-controls-bar,
        #pane-video.is-fullscreen #video-controls-bar {
            position: absolute;
            left: 16px;
            right: 16px;
            top: 16px;
            bottom: auto;
            background: rgba(0,0,0,0.45);
            border-radius: 6px;
            padding: 8px;
            transition: opacity 0.2s ease;
            opacity: 1;
            z-index: 20;
        }
        #pane-video.is-fullscreen .fullscreen-pref,
        #pane-video:fullscreen .fullscreen-pref,
        #pane-video:-webkit-full-screen .fullscreen-pref {
            display: none !important;
        }
        #pane-video:not(:hover):fullscreen #video-controls-bar,
        #pane-video:not(:hover):-webkit-full-screen #video-controls-bar,
        #pane-video.is-fullscreen:not(:hover) #video-controls-bar {
            opacity: 0;
        }

        /* Overlay toolbar — top-right of the video, fades in on hover */
        #video-btn-toolbar {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 10;
            display: flex;
            flex-direction: row;
            gap: 6px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        #pane-video:hover #video-btn-toolbar { opacity: 1; pointer-events: auto; }

        #record-btn {
            display: none;               /* hidden until state classes applied */
            align-items: center;
            gap: 5px;
            padding: 5px 11px;
            background: rgba(0,0,0,0.25);
            color: rgba(255,255,255,0.85);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.85em;
            cursor: pointer;
            backdrop-filter: blur(3px);
            transition: background 0.15s;
        }
        #record-btn:hover { background: rgba(0,0,0,0.6); color: #fff; }
        #record-btn.ready     { display: flex; }
        #record-btn.recording:hover { background: rgba(160,0,0,0.6); color: #fff; }
        #record-btn.recording {
            display: flex;
            background: rgba(160,0,0,0.35);
            border-color: rgba(255,80,80,0.5);
            animation: rec-pulse 1s ease-in-out infinite;
        }
        @keyframes rec-pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.5; }
        }

        /* event table pane */
        #pane-scores {
            overflow-x: auto;
            max-height: 50vh;
            overflow-y: auto;
        }
        #score-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 85%;
        }
        #score-table th {
            background: #444;
            color: #fff;
            padding: 6px 10px;
            text-align: left;
            position: sticky;
            top: 0;
        }
        #score-table td {
            padding: 5px 10px;
            border-bottom: 1px solid #ccc;
        }
        #score-table tr:nth-child(even) td { background: #f0f0f0; }
        #score-table tr:hover td { background: #dce8ff; }

        /* Apparatus colour coding */
        #score-table tr.app-vault  td { background-color: #d4f7d4; }
        #score-table tr.app-bars   td { background-color: #ffd4d4; }
        #score-table tr.app-beam   td { background-color: #fff6cc; }
        #score-table tr.app-floor  td { background-color: #d4e8ff; }
        #score-table tr.app-vault:hover  td { background-color: #aaeaaa; }
        #score-table tr.app-bars:hover   td { background-color: #ffaaaa; }
        #score-table tr.app-beam:hover   td { background-color: #ffecaa; }
        #score-table tr.app-floor:hover  td { background-color: #aaccff; }
        #score-table tr.score-highlight td { outline: 3px solid #e60; box-shadow: inset 0 0 0 2px #e60; }

        
        h1#heading {display: none; }
        /* Small screen: single column — scores/video first, buttons second, timeline last */
        @media (max-width: 700px) {
            body { display: flex; flex-direction: column; }
            .flex-layout {
                flex-direction: column;
                order: 1;
            }
            #timeline-wrapper { order: 2; }
            .tab-panel, .control-column {
                flex: 1 1 100%;
                min-width: 0;
            }
            .tab-panel    { order: 1; }
            .control-column { order: 2; }

            /* Clock moves inline with the heading — hide the standalone clock block */
            div#clock { display: none; }
            h1#heading {display: block; }
            h1#heading::after {
                content: attr(data-clock);
                font-size: 0.5em;
                font-weight: normal;
                opacity: 0.7;
                margin-left: 0.75em;
                vertical-align: middle;
            }
        }
    
        .vis-item {
            font-size: 80%;
            margin-top: 1px;
            margin-bottom: 1px;
        }
        #timeline-vis { font-size: 80%; }
        img {height: 12em;}
        h1#heading {margin: 10px 0px 10px 0px }
        .flex-layout {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 1%;
            margin-bottom: 1em;
        }

        .video-column {
            flex: 1 1 68%;
            min-width: 300px;
        }

        .control-column {
            flex: 1 1 30%;
            min-width: 16em;
            display: flex;
            flex-direction: column;
            justify-content:space-around;
            gap: 0.5em;
        }
        .control-column button {
            width: 100%;
            box-sizing: border-box;
        }
        .control-column label button {
            width: auto;
        }
        .btn-pair {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5em;
        }
        .btn-pair button {
            flex: 1 0 max-content;
        }
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            min-height: 60px;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
         /* ── Canvas timeline ── */
        #ctl-root { background:#f4f4f4; border:1px solid #bbb; border-radius:4px; overflow:hidden; display:flex; flex-direction:column; min-height:300px; font-size:80%; user-select:none; }
        #ctl-axis-row { display:flex; flex-shrink:0; background:#e8e8e8; border-bottom:2px solid #bbb; height:32px; position:relative; }
        #ctl-axis-label-pad { flex-shrink:0; background:#ddd; border-right:1px solid #bbb; }
        #ctl-axis-canvas-wrap { flex:1; position:relative; overflow:hidden; height:32px; }
        #ctl-axis-canvas { position:absolute; top:0; left:0; height:32px; pointer-events:none; }
        #ctl-body { display:flex; flex:1; overflow:hidden; position:relative; }
        #ctl-labels { flex-shrink:0; overflow:hidden; background:#ececec; border-right:1px solid #bbb; display:flex; flex-direction:column; }
        .ctl-label { display:flex; align-items:center; padding:0 6px; font-size:11px; color:#333; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; border-bottom:1px solid rgba(0,0,0,0.07); box-sizing:border-box; flex-shrink:0; }
        .ctl-label.video-group { color:#5577aa; font-style:italic; }
        .ctl-label.event-group { font-weight:600; color:#222; }
        #ctl-rows-wrap { flex:1; overflow:hidden; position:relative; cursor:crosshair; }
        #ctl-rows-canvas { position:absolute; top:0; left:0; display:block; }
        #ctl-now-line { position:absolute; top:0; bottom:0; width:2px; background:rgba(220,40,40,0.75); pointer-events:none; display:none; }
        #ctl-playhead  { position:absolute; top:0; bottom:0; width:2px; background:rgba(30,120,255,0.85); pointer-events:none; display:none; }
        #ctl-tooltip { position:fixed; background:rgba(20,20,20,0.93); color:#fff; padding:6px 10px; border-radius:5px; font-size:11px; line-height:1.5; pointer-events:none; display:none; z-index:9999; max-width:280px; white-space:pre-wrap; box-shadow:0 2px 8px rgba(0,0,0,0.4); }
	</style>
</head>

<script>
    setInterval(updateScreen,200);
    function updateScreen() {
        const timeStr = new Date().toTimeString().substr(0,8);
        document.getElementById("clock").innerHTML = timeStr;
        document.getElementById("heading").dataset.clock = timeStr;
        if (playbackStartTime != null) {
            const player = document.getElementById('player');
            if (!player.paused && !player.ended) {
                timeline.setCustomTime(new Date(Number(playbackStartTime)+player.currentTime*1000))
            }
        } else {
            try{timeline.removeCustomTime()} catch(e){}
        }
    }
    var xhr = new XMLHttpRequest();
    xhr.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
            var addresses=JSON.parse(xhr.responseText)
            var interfaces=Object.keys(addresses)
            var address_string=''
            if(interfaces.length==1) {
                address_string='https://'+addresses[interfaces[0]]+':3000/'
            } else {
                for(var i=0;i<interfaces.length;i++) {
                    address_string=(i==0?'':address_string+' or ')+'https://'+addresses[interfaces[i]]+':3000/'+' ('+interfaces[i]+')'
                }
            }
        }
    };
    xhr.open("GET", "/ip", true);
    xhr.send();


    function buildRoutineUpdateForVideo(filename, routineId) {
        const existing = items.get(routineId);
        if (!existing) return null;
        // Store video filename directly on the item — canvas uses _videoFile, not HTML content
        if (existing._videoFile === filename) return null;
        return { id: routineId, _videoFile: filename };
    }

    function addVideoItemsToTimeline(videos) {
        if (!Array.isArray(videos) || videos.length === 0) return;

        const newVideoGroups = new Map();
        const newVideoItems = [];
        const routineUpdates = [];

        videos.forEach(v => {
            if (v.camera_desc != null) {
                const groupId = 'V|' + v.camera_desc;
                if (!newVideoGroups.has(groupId)) {
                    newVideoGroups.set(groupId, {
                        id: groupId,
                        content: '\u{1F4F9} ' + v.camera_desc,
                        className: 'video-group'
                    });
                }
                newVideoItems.push({
                    id: v.filename,
                    group: groupId,
                    start: new Date(v.start_time),
                    end: new Date(v.start_time + v.length),
                    className: 'video-file',
                    title: v.filename
                });
            } else if (v.routine_id != null) {
                const update = buildRoutineUpdateForVideo(v.filename, v.routine_id);
                if (update) {
                    routineUpdates.push(update);
                }
                //Add to scores table too
                try {
                    document.getElementById('video-' + v.routine_id).innerHTML = `<span class="play-btn" data-video="${v.filename}" data-desc="" style="cursor:pointer;border:1px solid rgba(255,255,255,0.5);border-radius:3px;padding:0 2px">&#x23F5;</span>`;
                } catch(e) {}
            }
        });

        if (newVideoGroups.size) groups.add(Array.from(newVideoGroups.values()));
        if (newVideoItems.length) items.add(newVideoItems);
        if (routineUpdates.length) items.update(routineUpdates);
    }

    refreshVideos=()=>{
        document.getElementById('loading-overlay').style.display = 'flex'
        //Now put in the events:
        fetch('/eventlist')
        .then(data=>data.json())
        .then(data=> { 
            //Clear out timeline
            items.clear()
            groups.clear()
            if(data) {//Show routines — build all groups+items in one pass, then batch-add
                const APPARATUS_ORDER = ['Vault','Bars','Beam','Floor'];
                const newGroups = new Map();
                const newItems = [];
                // itemContent: #competitor · club · name (play buttons inserted after load)
                data.forEach((m) => {
                    const server = m.server || 'unknown';
                    const groupId = 'E|' + server + '|' + m.apparatus;
                    if (!newGroups.has(groupId)) {
                        newGroups.set(groupId, {
                            id: groupId,
                            content: m.apparatus + ' <span style="font-size:80%;opacity:0.6">' + server + '</span>',
                            className: 'event-group',
                            subgroupStack: true
                        });
                    }
                    const hasDuration = (m.time_stop - m.time_start > 0);
                    newItems.push({
                        id: m.id,
                        group: groupId,
                        start: m.time_start,
                        end: (m.time_stop ? m.time_stop : undefined),
                        type: (hasDuration ? 'range' : 'point'),
                        className: 'event-item',
                        // content: #num [play buttons injected later] club · name
                        content: m.competitor + ' · ' + m.club + ' · ' + m.name,
                        title: '<small>' + m.competitor + '<br />' + m.club + '<br />' + m.name + '</small>'
                    });
                });
                // Sort groups: known apparatus in fixed order per server, unknowns appended
                const sortedGroups = Array.from(newGroups.values()).sort((a, b) => {
                    // Extract apparatus name (part after last '|')
                    const appA = a.id.split('|').pop();
                    const appB = b.id.split('|').pop();
                    const srvA = a.id.split('|')[1];
                    const srvB = b.id.split('|')[1];
                    // Primary sort: server, Secondary: apparatus order
                    if (srvA !== srvB) return srvA < srvB ? -1 : 1;
                    const iA = APPARATUS_ORDER.indexOf(appA);
                    const iB = APPARATUS_ORDER.indexOf(appB);
                    const oA = iA === -1 ? 999 : iA;
                    const oB = iB === -1 ? 999 : iB;
                    return oA - oB;
                });
                groups.add(sortedGroups);  // single batch, ordered
                items.add(newItems);        // single batch
            }
            //start fetching videos
            fetch('/videolist')
            .then(data=>data.json())
            .then(data=> { 
                addVideoItemsToTimeline(data);
                setTimeout(()=>{
                    document.getElementById('loading-overlay').style.display = 'none'
                    hideEmptyGroups()
                    },150)
            })            
        })
    }

    var _zoomToNowActive = false;
    var _zoomToNowInterval = null;

    function disableZoomToNow() {
        if (!_zoomToNowActive) return;
        _zoomToNowActive = false;

        if (btn) {
            btn.style.background = '#ccc';
            btn.style.color = '';

    function applyZoomToNow() {
        if (!timeline || typeof timeline.setWindow !== 'function') return;
        _zoomToNowProgrammatic = true;
        timeline.setWindow(new Date(Date.now() - 18 * 60 * 1000), new Date(Date.now() + 2 * 60 * 1000), {animation: false});

    function toggleZoomToNow() {

        const btn = document.getElementById('zoom-now-btn');
        if (_zoomToNowActive) {
            btn.style.background = '#2a7ae2';
            btn.style.color = '#fff';

    let searchState = {
        searchText: '',
        matchingItems: [],
        currentIndex: -1
    };
    findEvent=()=>{
        //Zoom to 5 minutes only
        const lowerSearch = document.getElementById('eventdesc').value.toLowerCase();
        // If search text changed, reset match state
        if (lowerSearch !== searchState.searchText.toLowerCase()) {
            searchState.searchText = lowerSearch;
            searchState.matchingItems = items.get().filter(item =>
                item.content && item.content.toLowerCase().includes(lowerSearch)
            );
            searchState.currentIndex = 0;
        }

        const matches = searchState.matchingItems;
        if (matches.length === 0) {
            alert(`No items found for "${searchText}"`);
            return;
        }

        // Move to next item
        searchState.currentIndex = (searchState.currentIndex - 1) % matches.length;
        const matchedItem = matches[searchState.currentIndex];

        // Highlight and zoom
        timeline.setSelection([matchedItem.id]);
        disableZoomToNow()
        zoomToItem(matchedItem.id); // defined earlier
        
    }
    zoomToItem = (itemId, zoomMargin = 0.25, zoomSeconds=120 )=>{
        disableZoomToNow();
        const item = items.get(itemId);
        if (!item) return;

        const start = new Date(item.start);
        const end = item.end ? new Date(item.end) : start;
        const duration = end - start || 0;
        const margin = (duration==0?zoomSeconds*1000:duration * zoomMargin)

        const windowStart = new Date(start.getTime() - margin);
        const windowEnd = new Date(end.getTime() + margin);

        timeline.setWindow(windowStart, windowEnd, { animation: true });
        hideEmptyGroups();
    }
    playbackSelected=()=>{
        const selectedIds = timeline.getSelection();
        if (selectedIds.length === 0) { alert('No video selected'); return; }

        // Build ordered list of video filenames from selection
        videosToAppend = [];
        selectedIds.forEach(id => {
            const item = items.get(id);
            if (!item) return;
            if (item.className === 'video-file') {
                // id IS the filename for video-file items
                videosToAppend.push(String(id));
            } else if (item._videoFile) {
                videosToAppend.push(item._videoFile);
            }
        });
        // Sort by filename (which encodes timestamps)
        videosToAppend.sort();
        if (videosToAppend.length === 0) { alert('No video found for selection'); return; }

        startPlayback().then(() => switchTab('video'));
    }
    document.getElementById('date').value=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0')+'-'+String(new Date().getDate()).padStart(2,'0')
    refreshVideos()
    
    var videosToAppend=[]

    function hideEmptyGroups() {
        const range = timeline.getWindow(); // Get current visible window
        const allGroups = groups.get();
        const allItems = items.get();

        // Get IDs of groups that have at least one visible item
        const groupsWithVisibleItems = new Set();

        allItems.forEach(item => {
            const itemStart = new Date(item.start);
            const itemEnd = item.end ? new Date(item.end) : itemStart;

            const isVisible =
            (itemEnd >= range.start && itemStart <= range.end); // Overlaps with window

            if (isVisible) {
            groupsWithVisibleItems.add(item.group);
            }
        });

        // Filter the groups to only those that have visible items
        const visibleGroups = allGroups.filter(group => groupsWithVisibleItems.has(group.id));

        // Re-set the groups on the timeline (this doesn’t remove items, just hides their groups)
        timeline.setGroups(visibleGroups);
    }

    // ═══════════════════════════════════════════════════════════════════
    // CANVAS TIMELINE ENGINE
    // Replaces vis-timeline. Exposes the same items/groups/timeline API.
    // ═══════════════════════════════════════════════════════════════════
    ;(function buildCanvasTimeline() {

        // ── Internal data stores ────────────────────────────────────────
        const _iMap = new Map();   // id → item object
        const _gMap = new Map();   // id → group object (insertion-ordered)

        // ── Apparatus colours ───────────────────────────────────────────
        const APP_COL = {
            vault: { fill:'#5cb85c', stroke:'#3d8b3d', sel:'#80e880', text:'#fff' },
            bars:  { fill:'#d9534f', stroke:'#a02020', sel:'#f08080', text:'#fff' },
            beam:  { fill:'#c8a800', stroke:'#8a7200', sel:'#ffe060', text:'#333' },
            floor: { fill:'#3a8fd4', stroke:'#1f5fa0', sel:'#70c8ff', text:'#fff' },
        };
        function appCol(apparatus) {
            if (!apparatus) return null;
            const a = apparatus.toLowerCase();
            if (a.includes('vault')) return APP_COL.vault;
            if (a.includes('bar'))   return APP_COL.bars;
            if (a.includes('beam'))  return APP_COL.beam;
            if (a.includes('floor')) return APP_COL.floor;
            return null;
        }

        // ── View state ──────────────────────────────────────────────────
        const ROW_H   = 30;
        const LABEL_W = 140;
        const AXIS_H  = 32;
        let vsMs = new Date().setHours(7,30,0,0);   // viewStart ms
        let veMs = new Date().setHours(20,30,0,0);  // viewEnd ms
        let _customTimeMs = null;
        const _sel = new Set();          // selected item ids
        let _visGroupIds = null;         // null = show all

        // ── DOM references ──────────────────────────────────────────────
        const axisCanvas  = document.getElementById('ctl-axis-canvas');
        const rowsCanvas  = document.getElementById('ctl-rows-canvas');
        const labelsEl    = document.getElementById('ctl-labels');
        const axisWrap    = document.getElementById('ctl-axis-canvas-wrap');
        const rowsWrap    = document.getElementById('ctl-rows-wrap');
        const nowLineAxis = document.getElementById('ctl-now-line');
        const nowLineRows = document.getElementById('ctl-now-line-rows');
        const phAxis      = document.getElementById('ctl-playhead');
        const phRows      = document.getElementById('ctl-playhead-rows');
        const tooltipEl   = document.getElementById('ctl-tooltip');

        // Style the secondary now-line / playhead in the rows area
        for (const el of [nowLineRows, phRows]) {
            el.style.cssText = 'position:absolute;top:0;bottom:0;width:2px;pointer-events:none;display:none;';
        }
        nowLineRows.style.background = 'rgba(220,40,40,0.55)';
        phRows.style.background      = 'rgba(30,120,255,0.75)';
        document.getElementById('ctl-axis-label-pad').style.width = LABEL_W + 'px';

        // ── Coordinate helpers ──────────────────────────────────────────
        function msToFrac(ms)  { return (ms - vsMs) / (veMs - vsMs); }
        function msToX(ms, w)  { return msToFrac(ms) * w; }
        function xToMs(x, w)   { return vsMs + (x / w) * (veMs - vsMs); }

        // ── Ordered visible groups ──────────────────────────────────────
        const APP_ORDER = ['Vault','Bars','Beam','Floor'];
        function orderedGroups() {
            let gs = [..._gMap.values()];
            if (_visGroupIds) gs = gs.filter(g => _visGroupIds.has(g.id));
            gs.sort((a, b) => {
                const aV = a.id.startsWith('V|'), bV = b.id.startsWith('V|');
                if (aV !== bV) return aV ? -1 : 1;   // video rows first
                if (aV)  return a.id < b.id ? -1 : 1;
                const [,sA,appA] = a.id.split('|');
                const [,sB,appB] = b.id.split('|');
                if (sA !== sB)  return sA < sB ? -1 : 1;
                const iA = APP_ORDER.indexOf(appA), iB = APP_ORDER.indexOf(appB);
                return (iA<0?999:iA) - (iB<0?999:iB);
            });
            return gs;
        }

        // ── rAF-batched render ──────────────────────────────────────────
        let _rafPending = false;
        function render() {
            if (_rafPending) return;
            _rafPending = true;
            requestAnimationFrame(_draw);
        }

        function _draw() {
            _rafPending = false;
            const gs  = orderedGroups();
            const dpr = window.devicePixelRatio || 1;
            const aw  = axisWrap.clientWidth  || 800;
            const rh  = Math.max(gs.length * ROW_H, 1);
            const rw  = rowsWrap.clientWidth  || 800;

            // Size axis canvas
            if (axisCanvas.width !== aw*dpr || axisCanvas.height !== AXIS_H*dpr) {
                axisCanvas.width = aw*dpr; axisCanvas.height = AXIS_H*dpr;
                axisCanvas.style.width = aw+'px'; axisCanvas.style.height = AXIS_H+'px';
            }
            // Size rows canvas
            const needRh = rh * dpr;
            if (rowsCanvas.width !== rw*dpr || rowsCanvas.height !== needRh) {
                rowsCanvas.width = rw*dpr; rowsCanvas.height = needRh;
                rowsCanvas.style.width = rw+'px'; rowsCanvas.style.height = rh+'px';
            }
            rowsWrap.style.minHeight = Math.max(rh, 260) + 'px';

            const actx = axisCanvas.getContext('2d');
            const rctx = rowsCanvas.getContext('2d');
            actx.setTransform(dpr,0,0,dpr,0,0);
            rctx.setTransform(dpr,0,0,dpr,0,0);

            _drawAxis(actx, aw);
            _drawRows(rctx, rw, gs, rh);
            _drawLabels(gs);
            _positionLines(aw, rw);
        }

        // ── Axis ticks ──────────────────────────────────────────────────
        const TICK_INTERVALS = [
            60e3, 2*60e3, 5*60e3, 10*60e3, 15*60e3, 30*60e3,
            3600e3, 2*3600e3, 4*3600e3, 6*3600e3, 12*3600e3, 24*3600e3
        ];
        function pickInterval(w) {
            return TICK_INTERVALS.find(iv => iv/(veMs-vsMs)*w >= 55) || TICK_INTERVALS[TICK_INTERVALS.length-1];
        }

        function _drawAxis(ctx, w) {
            ctx.clearRect(0,0,w,AXIS_H);
            ctx.fillStyle = '#e8e8e8'; ctx.fillRect(0,0,w,AXIS_H);
            const iv = pickInterval(w);
            const t0 = Math.ceil(vsMs/iv)*iv;
            ctx.strokeStyle = '#aaa'; ctx.fillStyle = '#444';
            ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            for (let t = t0; t <= veMs; t += iv) {
                const x = msToX(t, w);
                ctx.beginPath(); ctx.moveTo(x, AXIS_H-8); ctx.lineTo(x, AXIS_H); ctx.lineWidth=1; ctx.stroke();
                const d = new Date(t);
                ctx.fillText(d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'), x, AXIS_H/2-2);
            }
            // minor ticks
            const minor = iv/2;
            if (minor/(veMs-vsMs)*w >= 20) {
                const m0 = Math.ceil(vsMs/minor)*minor;
                ctx.strokeStyle='#ccc'; ctx.lineWidth=0.5;
                for (let t=m0; t<=veMs; t+=minor) {
                    if (t%iv===0) continue;
                    const x=msToX(t,w);
                    ctx.beginPath(); ctx.moveTo(x,AXIS_H-4); ctx.lineTo(x,AXIS_H); ctx.stroke();
                }
            }
        }

        // ── Row drawing ─────────────────────────────────────────────────
        function _drawRows(ctx, w, gs, totalH) {
            ctx.clearRect(0,0,w,totalH);
            const iv = pickInterval(w);

            gs.forEach((g, ri) => {
                const ry = ri * ROW_H;
                // Alternating row background
                ctx.fillStyle = ri%2===0 ? '#f8f8f8' : '#f0f0f0';
                ctx.fillRect(0, ry, w, ROW_H);
                // Grid lines
                ctx.strokeStyle='rgba(0,0,0,0.05)'; ctx.lineWidth=1;
                const t0=Math.ceil(vsMs/iv)*iv;
                for (let t=t0; t<=veMs; t+=iv) {
                    const x=msToX(t,w);
                    ctx.beginPath(); ctx.moveTo(x,ry); ctx.lineTo(x,ry+ROW_H); ctx.stroke();
                }

                // Items in this group that overlap the view
                const groupItems = [..._iMap.values()].filter(it => {
                    if (it.group !== g.id) return false;
                    const s = +it.start, e = +(it.end||it.start);
                    return e >= vsMs && s <= veMs;
                });

                const pad=3, ih=ROW_H-pad*2;
                groupItems.forEach(item => {
                    const s = +item.start, e = +(item.end||item.start);
                    const x1 = Math.max(0, msToX(s, w));
                    const x2 = e>s ? Math.min(w, msToX(e, w)) : x1;
                    const iw  = x2 - x1;
                    const sel = _sel.has(item.id);
                    const isVideo = item.className === 'video-file';

                    if (isVideo) {
                        _filmstrip(ctx, x1, ry+pad, Math.max(iw,3), ih, sel);
                    } else if (iw >= 6) {
                        // Range box
                        const col = appCol(item._apparatus);
                        ctx.fillStyle   = sel ? '#ff9900' : (col?col.fill:'#6a9fd8');
                        ctx.strokeStyle = sel ? '#ffcc44' : (col?col.stroke:'#3a6fa8');
                        ctx.lineWidth = sel ? 2 : 1;
                        _rr(ctx, x1, ry+pad, iw, ih, 3); ctx.fill(); ctx.stroke();
                        // Play badge if video attached — dark pill so it's visible on any colour
                        let labelX = x1+4;
                        if (item._videoFile) {
                            const bw=16, bh=ih-2, bx=labelX, by=ry+pad+1;
                            ctx.fillStyle='rgba(0,0,0,0.5)';
                            _rr(ctx,bx,by,bw,bh,2); ctx.fill();
                            ctx.fillStyle='#fff';
                            ctx.font='bold 9px sans-serif'; ctx.textBaseline='middle'; ctx.textAlign='center';
                            ctx.fillText('▶', bx+bw/2, ry+pad+ih/2);
                            // Store badge screen rect on item for click detection
                            item._badgeRect={x:bx, y:by, w:bw, h:bh, row:ri};
                            labelX += bw+3;
                        } else {
                            delete item._badgeRect;
                        }
                        // Clipped label
                        ctx.save();
                        ctx.rect(labelX, ry+pad, x2-labelX-3, ih); ctx.clip();
                        ctx.fillStyle = sel ? '#000' : (col?col.text:'#fff');
                        ctx.font='10px sans-serif'; ctx.textBaseline='middle'; ctx.textAlign='left';
                        ctx.fillText(item._label||'', labelX, ry+pad+ih/2);
                        ctx.restore();
                    } else {
                        // Point item: ■ if ended, ▶ if in-progress
                        const col = appCol(item._apparatus);
                        const hasEnd = item.end ;
                        const symbol = hasEnd ? '■' : '▶';
                        const cx = (x1+x2)/2, cy = ry + ROW_H/2;
                        const sz = sel ? 13 : 11;
                        ctx.font = `${sz}px sans-serif`;
                        ctx.textBaseline = 'middle';
                        ctx.textAlign = 'center';
                        // Shadow/outline for legibility
                        ctx.fillStyle = sel ? '#ff9900' : (col ? col.fill : '#6a9fd8');
                        ctx.fillText(symbol, cx, cy);
                        if (sel) {
                            ctx.strokeStyle = '#ffcc44';
                            ctx.lineWidth = 1;
                            ctx.strokeText(symbol, cx, cy);
                        }
                        // Label to the right of the symbol
                        const labelX = cx + sz * 0.75;
                        const availW = rowsCanvas.width / (window.devicePixelRatio||1) - labelX - 2;
                        if (availW > 20) {
                            ctx.save();
                            ctx.rect(labelX, ry, availW, ROW_H); ctx.clip();
                            ctx.fillStyle = sel ? '#222' : '#333';
                            ctx.font = '10px sans-serif';
                            ctx.textAlign = 'left';
                            ctx.fillText(item._label || '', labelX + 3, cy);
                            ctx.restore();
                        }
                    }
                });
                // Row separator
                ctx.strokeStyle='rgba(0,0,0,0.1)'; ctx.lineWidth=1;
                ctx.beginPath(); ctx.moveTo(0,ry+ROW_H-0.5); ctx.lineTo(w,ry+ROW_H-0.5); ctx.stroke();
            });
        }

        function _filmstrip(ctx, x, y, w, h, sel) {
            if (w<2) return;
            ctx.fillStyle = sel ? '#ff9900' : '#6a7a8a';
            _rr(ctx,x,y,w,h,2); ctx.fill();
            if (sel) { ctx.strokeStyle='#ffcc44'; ctx.lineWidth=2; _rr(ctx,x,y,w,h,2); ctx.stroke(); }
            // Sprocket holes
            const hw=5, hh=Math.min(3,Math.floor(h/4)), hgap=9;
            ctx.fillStyle = sel ? 'rgba(0,0,0,0.45)' : 'rgba(0,0,0,0.4)';
            for (let hx=x+3; hx+hw<x+w-1; hx+=hw+hgap) {
                ctx.fillRect(hx, y+1, hw, hh);
                ctx.fillRect(hx, y+h-1-hh, hw, hh);
            }
            // Film body gradient hint
            const grad = ctx.createLinearGradient(x,y,x,y+h);
            grad.addColorStop(0,   'rgba(255,255,255,0.15)');
            grad.addColorStop(0.25,'rgba(255,255,255,0)');
            grad.addColorStop(0.75,'rgba(255,255,255,0)');
            grad.addColorStop(1,   'rgba(255,255,255,0.15)');
            ctx.fillStyle=grad; ctx.fillRect(x,y,w,h);
        }

        function _rr(ctx, x, y, w, h, r) {
            r=Math.min(r,w/2,h/2);
            ctx.beginPath();
            ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
            ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
            ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
            ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
            ctx.closePath();
        }

        // ── Label column ────────────────────────────────────────────────
        function _drawLabels(gs) {
            labelsEl.style.width  = LABEL_W + 'px';
            labelsEl.style.minHeight = Math.max(gs.length*ROW_H,260)+'px';
            // Sync DOM label divs with groups
            const existing = [...labelsEl.children];
            while (labelsEl.children.length < gs.length) {
                const d=document.createElement('div'); d.className='ctl-label'; labelsEl.appendChild(d);
            }
            while (labelsEl.children.length > gs.length) labelsEl.removeChild(labelsEl.lastChild);
            gs.forEach((g,i) => {
                const d=labelsEl.children[i];
                d.innerHTML = g.content||g.id;
                d.className = 'ctl-label '+(g.className||'');
                d.style.height = ROW_H+'px';
                d.style.background = i%2===0?'#ececec':'#e4e4e4';
            });
        }

        // ── Now-line & playhead positioning ─────────────────────────────
        function _positionLines(aw, rw) {
            const now = Date.now();
            const showNow = now >= vsMs && now <= veMs;
            const nx = msToX(now, aw);
            nowLineAxis.style.display = showNow?'block':'none';
            nowLineAxis.style.left    = nx+'px';
            nowLineRows.style.display = showNow?'block':'none';
            nowLineRows.style.left    = msToX(now,rw)+'px';

            const showPh = _customTimeMs!==null && _customTimeMs>=vsMs && _customTimeMs<=veMs;
            phAxis.style.display = showPh?'block':'none';
            phAxis.style.left    = msToX(_customTimeMs,aw)+'px';
            phRows.style.display = showPh?'block':'none';
            phRows.style.left    = msToX(_customTimeMs,rw)+'px';
        }

        // ── Tooltip ─────────────────────────────────────────────────────
        let _hoverId = null;
        function _showTip(item, cx, cy) {
            if (!item) { tooltipEl.style.display='none'; _hoverId=null; return; }
            _hoverId = item.id;
            let html = item.title || item._label || String(item.id);
            if (item._videoFile)       html += '<br/><em style="opacity:0.7">▶ click badge to play</em>';
            if (item.className==='video-file') html = (item.title||String(item.id)) + '<br/><em style="opacity:0.7">click to play</em>';
            tooltipEl.innerHTML = html;
            tooltipEl.style.display = 'block';
            _moveTip(cx, cy);
        }
        function _moveTip(cx, cy) {
            const tw=tooltipEl.offsetWidth, th=tooltipEl.offsetHeight;
            let tx=cx+14, ty=cy-10;
            if (tx+tw>window.innerWidth-8) tx=cx-tw-14;
            if (ty+th>window.innerHeight-8) ty=window.innerHeight-th-8;
            tooltipEl.style.left=tx+'px'; tooltipEl.style.top=ty+'px';
        }

        // ── Hit testing ─────────────────────────────────────────────────
        function _itemAt(x, y, w) {
            const gs = orderedGroups();
            const ri = Math.floor(y/ROW_H);
            if (ri<0||ri>=gs.length) return null;
            const g=gs[ri];
            const pad=3, ih=ROW_H-pad*2;
            let best=null, bestW=Infinity;
            for (const item of _iMap.values()) {
                if (item.group!==g.id) continue;
                const s=+item.start, e=+(item.end||item.start);
                const x1=msToX(s,w), x2=e>s?msToX(e,w):x1;
                const iw=x2-x1;
                if (iw>=6) { if (x>=x1&&x<=x2&&iw<bestW) { best=item; bestW=iw; } }
                else { if (Math.abs((x1+x2)/2-x)<=9&&iw<bestW) { best=item; bestW=iw; } }
            }
            return best;
        }

        // ── Interaction ─────────────────────────────────────────────────
        let _drag=null;  // {startClientX, vs0, ve0}
        let _pinch=null; // {dist, vs0, ve0}
        let _lastTapMs=0;

        function _canvasPos(e) {
            const r=rowsWrap.getBoundingClientRect();
            const src=e.touches?e.touches[0]:e;
            return {x:src.clientX-r.left, y:src.clientY-r.top};
        }

        rowsWrap.addEventListener('mousedown', e=>{
            _drag={startClientX:e.clientX, vs0:vsMs, ve0:veMs};
            rowsWrap.style.cursor='grabbing';
            e.preventDefault();
        });

        window.addEventListener('mousemove', e=>{
            if (_drag) {
                const span=_drag.ve0-_drag.vs0;
                const shift=-( (e.clientX-_drag.startClientX) / rowsWrap.clientWidth ) * span;
                vsMs=_drag.vs0+shift; veMs=_drag.ve0+shift;
                render(); _emit('rangechanged',{});
            } else {
                const r=rowsWrap.getBoundingClientRect();
                const x=e.clientX-r.left, y=e.clientY-r.top;
                if (x>=0&&x<=rowsWrap.clientWidth&&y>=0&&y<=rowsWrap.clientHeight) {
                    const item=_itemAt(x,y,rowsWrap.clientWidth);
                    if (item?.id!==_hoverId) _showTip(item,e.clientX,e.clientY);
                    else if (item) _moveTip(e.clientX,e.clientY);
                } else { tooltipEl.style.display='none'; _hoverId=null; }
            }
        });
        window.addEventListener('mouseup', e=>{
            if (_drag && Math.abs(e.clientX-_drag.startClientX)<5) {
                // treat as click
                const {x,y}=_canvasPos(e);
                _handleClick(x,y,e.shiftKey||e.ctrlKey||e.metaKey);
            }
            _drag=null; rowsWrap.style.cursor='crosshair';
        });
        rowsWrap.addEventListener('mouseleave',()=>{ tooltipEl.style.display='none'; _hoverId=null; });

        function _handleClick(x,y,multi) {
            // Check if click lands on a play badge first
            for (const item of _iMap.values()) {
                const b = item._badgeRect;
                if (b && x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h) {
                    document.getElementById('player').src = '/video/' + item._videoFile;
                    document.getElementById('videodesc').innerHTML = ': ' + item._videoFile;
                    switchTab('video');
                    return;
                }
            }
            // video-file items: single click plays, shift-click range-selects within group
            const item = _itemAt(x, y, rowsWrap.clientWidth);

            if (item && item.className === 'video-file') {
                if (multi && _sel.size > 0) {
                    // Find the anchor — the first selected video-file item in the same group
                    const anchor = [..._iMap.values()].find(
                        it => _sel.has(it.id) && it.className === 'video-file' && it.group === item.group
                    );
                    if (anchor) {
                        // Select all video-file items in this group between anchor and clicked item by time
                        const aStart = +anchor.start, bStart = +item.start;
                        const lo = Math.min(aStart, bStart), hi = Math.max(aStart, bStart);
                        _sel.clear();
                        [..._iMap.values()]
                            .filter(it => it.className === 'video-file' && it.group === item.group
                                      && +it.start >= lo && +it.start <= hi)
                            .forEach(it => _sel.add(it.id));
                        render(); _emit('select', {items:[..._sel]});
                        return;
                    }
                }
                // Plain click on video-file: select it (for Load & Play) or play if already sole selection
                if (_sel.size === 1 && _sel.has(item.id)) {
                    // Second click on already-selected solo item → play it
                    videosToAppend = [String(item.id)];
                    startPlayback().then(()=>switchTab('video'));
                    return;
                }
                _sel.clear(); _sel.add(item.id);
                render(); _emit('select', {items:[..._sel]});
                return;
            }

            // Event (routine) items: single-select only, no multi-select
            if (!item) { _sel.clear(); render(); _emit('select',{items:[]}); return; }
            if (_sel.size === 1 && _sel.has(item.id)) _sel.clear();
            else { _sel.clear(); _sel.add(item.id); }
            render(); _emit('select',{items:[..._sel]});

        // Touch
        rowsWrap.addEventListener('touchstart', e=>{
            if (e.touches.length===1) {
                _drag={startClientX:e.touches[0].clientX, vs0:vsMs, ve0:veMs};
                const now=Date.now();
                if (now-_lastTapMs<300) { _doubleTap(e.touches[0].clientX); }
                _lastTapMs=now;
            } else if (e.touches.length===2) {
                _drag=null;
                _pinch={dist:_touchDist(e), vs0:vsMs, ve0:veMs,
                        cx:(_touchMidX(e)-rowsWrap.getBoundingClientRect().left)};
            }

        },{passive:false});

        rowsWrap.addEventListener('touchmove', e=>{
            if (e.touches.length===1&&_drag) {
                const span=_drag.ve0-_drag.vs0;
                const shift=-((e.touches[0].clientX-_drag.startClientX)/rowsWrap.clientWidth)*span;
                vsMs=_drag.vs0+shift; veMs=_drag.ve0+shift;
                render(); _emit('rangechanged',{});
            } else if (e.touches.length===2&&_pinch) {
                const newDist=_touchDist(e);
                const factor=_pinch.dist/newDist;
                const {vs0,ve0,cx}=_pinch;
                _zoomAround(cx,factor,vs0,ve0);
                render(); _emit('rangechanged',{});
            }
            e.preventDefault();
        },{passive:false});

        rowsWrap.addEventListener('touchend', e=>{
            if (e.touches.length===0&&_drag&&Math.abs(e.changedTouches[0].clientX-_drag.startClientX)<8) {
                const r=rowsWrap.getBoundingClientRect();
                const x=e.changedTouches[0].clientX-r.left, y=e.changedTouches[0].clientY-r.top;
                // multi=true when there's already a video-file selection (range-select gesture)
                const hasVideoSel = [..._sel].some(id=>{ const it=_iMap.get(id); return it&&it.className==='video-file'; });
                _handleClick(x, y, hasVideoSel);
            }
            _drag=null; _pinch=null;
        });

        function _touchDist(e) {
            return Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
        }
        function _touchMidX(e) { return (e.touches[0].clientX+e.touches[1].clientX)/2; }
        function _doubleTap(clientX) {
            const x=clientX-rowsWrap.getBoundingClientRect().left;
            _zoomAround(x,0.45,vsMs,veMs); render(); _emit('rangechanged',{});
        }

        // Scroll-wheel zoom (ctrl not required — axis covers pan)
        rowsWrap.addEventListener('wheel', e=>{
            e.preventDefault();
            const x=e.clientX-rowsWrap.getBoundingClientRect().left;
            _zoomAround(x, e.deltaY>0?1.18:1/1.18, vsMs, veMs);
            render(); _emit('rangechanged',{});
        },{passive:false});

        function _zoomAround(px, factor, vs, ve) {
            const span=ve-vs, ratio=px/rowsWrap.clientWidth;
            const pivot=vs+ratio*span;
            const newSpan=Math.max(60e3, Math.min(span*factor, 7*24*3600e3));
            vsMs=pivot-ratio*newSpan; veMs=pivot+(1-ratio)*newSpan;
        }

        // ── Event emitter ───────────────────────────────────────────────
        const _listeners={};
        function _emit(name,data){ (_listeners[name]||[]).forEach(fn=>fn(data)); }

        // ── Live now-line ticker ────────────────────────────────────────
        setInterval(()=>{ _positionLines(axisWrap.clientWidth||800, rowsWrap.clientWidth||800); }, 2000);

        // ── Resize ──────────────────────────────────────────────────────
        new ResizeObserver(render).observe(rowsWrap);
        new ResizeObserver(render).observe(axisWrap);

        // ═══════════════════════════════════════════════════════════════
        // PUBLIC API — matches the interface used by the rest of the page
        // ═══════════════════════════════════════════════════════════════

        // items DataSet shim
        window.items = {
            add(arr) {
                [].concat(arr).forEach(it => {
                    const existing = _iMap.get(it.id)||{};
                    const merged = {...existing, ...it};
                    // Derive internal fields for fast canvas use
                    merged._apparatus = it.group ? it.group.split('|')[2] : (existing._apparatus||'');
                    merged._label     = _plainText(it.content || existing.content || '');
                    _iMap.set(it.id, merged);
                });
                render();
            },
            update(arr) {
                [].concat(arr).forEach(it => {
                    const existing = _iMap.get(it.id)||{};
                    const merged = {...existing, ...it};
                    // Re-derive canvas fields if relevant props changed
                    if (it.group)              merged._apparatus = it.group.split('|')[2];
                    if (it.content !== undefined) merged._label = _plainText(it.content);
                    // _videoFile and other _ fields pass through from caller directly
                    _iMap.set(it.id, merged);
                });
                render();
            },
            remove(arr) { [].concat(arr).forEach(it=>_iMap.delete(typeof it==='object'?it.id:it)); render(); },
            clear()     { _iMap.clear(); render(); },
            get(id)     { return id==null ? [..._iMap.values()] : (_iMap.get(id)||null); },
        };

        // groups DataSet shim
        window.groups = {
            add(arr) {
                [].concat(arr).forEach(g=>{ if(!_gMap.has(g.id)) _gMap.set(g.id,g); });
                render();
            },
            update(arr) {
                [].concat(arr).forEach(g=>_gMap.set(g.id,{...(_gMap.get(g.id)||{}), ...g}));
                render();
            },
            clear() { _gMap.clear(); render(); },
            get()   { return [..._gMap.values()]; },
        };

        // timeline object shim
        window.timeline = {
            on(name, fn) { _listeners[name]=_listeners[name]||[]; _listeners[name].push(fn); },
            getWindow()           { return {start:new Date(vsMs), end:new Date(veMs)}; },
            setWindow(s, e, opts) {
                vsMs=+s; veMs=+e; render();
                if (!opts?.animation) _emit('rangechanged',{});
            },
            setGroups(gs) {
                _visGroupIds = gs ? new Set(gs.map(g=>g.id)) : null;
                render();
            },
            getSelection()    { return [..._sel]; },
            setSelection(ids) { _sel.clear(); ids.forEach(id=>_sel.add(id)); render(); },
            setCustomTime(t)  { _customTimeMs=+t; _positionLines(axisWrap.clientWidth||800,rowsWrap.clientWidth||800); },
            removeCustomTime(){ _customTimeMs=null; _positionLines(axisWrap.clientWidth||800,rowsWrap.clientWidth||800); },
            addCustomTime(t)  { _customTimeMs=+t; _positionLines(axisWrap.clientWidth||800,rowsWrap.clientWidth||800); },
        };

        // Helper: strip HTML to plain text for canvas labels
        function _plainText(html) {
            const d=document.createElement('div'); d.innerHTML=html;
            return d.textContent||d.innerText||'';
        }

        // Initial render
        render();

    })(); // end canvas timeline IIFE

    // Map EBML codec ID to MediaSource codec string
    function extractCodec(track) {
        // Video fallback
        if (track['@type'] === 'Video') {
            if (track.Format === 'AVC') {
                // Profile/Level → avc1.640028 (High@L4.0)
                const profileIDC = {
                    'Baseline': '42',
                    'Main': '4D',
                    'High': '64',
                }[track.Format_Profile] || '42';

                const levelHex = (parseFloat(track.Format_Level || '3.0') * 10).toString(16).padStart(2, '0');
                return `avc1.${profileIDC}00${levelHex}`;
            }

            if (track.Format === 'HEVC') return 'hvc1';
            if (track.Format === 'VP8') return 'vp8';
            if (track.Format === 'VP9') return 'vp9';
            if (track.Format === 'AV1') return 'av01';
        }
        if (track['@type'] === 'Audio') {
            if (track.Format === 'AAC') return 'mp4a.40.2';
            if (track.Format === 'MP3') return 'mp3';
            if (track.Format === 'Opus') return 'opus';
            if (track.Format === 'Vorbis') return 'vorbis';
            if (track.Format === 'FLAC') return 'flac';
        }

        return null;
    }
    function inferMimeType(format) {
        const map = {
            'MPEG-4': 'video/mp4',
            'MPEG Audio': 'audio/mpeg',
            'MPEG Video': 'video/mpeg',
            'Matroska': 'video/webm',
            'WebM': 'video/webm',
            'AVI': 'video/x-msvideo',
            'Wave': 'audio/wav',
            'AAC': 'audio/aac',
            'FLAC': 'audio/flac',
            'Opus': 'audio/ogg',
            'Ogg': 'audio/ogg',
            'QuickTime': 'video/quicktime',
            'WMV': 'video/x-ms-wmv',
            'RealMedia': 'application/vnd.rn-realmedia',
            '3GP': 'video/3gpp',
        };
        return map[format] || 'application/octet-stream';
    }
    function getMimeTypeAndCodecs(mediaInfoResult) {
        const tracks = mediaInfoResult?.media?.track || [];

        const generalTrack = tracks.find(t => t['@type'] === 'General');
        const mimeType = generalTrack?.MimeType || inferMimeType(generalTrack?.Format || '');

        const codecTracks = tracks.filter(t => ['Video', 'Audio'].includes(t['@type']));
        const codecs = codecTracks.map(track => extractCodec(track)).filter(Boolean);

        return `${mimeType}; codecs="${codecs.join(', ')}"`;
    }

    // ── Clip recording via MediaRecorder ────────────────────────────────────────
    var _clipRecorder   = null;
    var _clipChunks     = [];
    var _clipMime       = '';
    var _clipStartVideo = 0;   // video.currentTime when recording started

    function toggleClipRecording() {
        if (_clipRecorder && _clipRecorder.state === 'recording') {
            _stopClip();
        } else {
            _startClip();
        }
    }

    function _startClip() {
        const video = document.getElementById('player');
        if (!video.srcObject && !video.src) return;

        // Prefer webm/vp8 as it is universally supported by MediaRecorder.
        // Fall back to whatever the browser supports.
        const preferredMime = ['video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4']
            .find(m => MediaRecorder.isTypeSupported(m)) || '';

        let stream;
        try {
            stream = video.captureStream();
        } catch(e) {
            alert('captureStream() not supported in this browser.');
            return;
        }

        _clipChunks = [];
        _clipMime   = preferredMime;
        _clipStartVideo = video.currentTime;

        _clipRecorder = new MediaRecorder(stream, preferredMime ? { mimeType: preferredMime } : {});
        _clipRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) _clipChunks.push(e.data); };
        _clipRecorder.onstop = _finishClip;
        _clipRecorder.start(1000); // collect data every 100 ms

        // Update button appearance
        const btn = document.getElementById('record-btn');
        const lbl = document.getElementById('record-btn-label');
        btn.className = 'recording';
        lbl.textContent = 'Stop';
    }

    function _stopClip() {
        if (_clipRecorder && _clipRecorder.state !== 'inactive') {
            _clipRecorder.stop();
        }
    }

    function _finishClip() {
        if (_clipChunks.length === 0) return;

        const mimeBase = (_clipMime || 'video/webm').split(';')[0];
        const ext = mimeBase.includes('mp4') ? 'mp4' : 'webm';

        // Build a filename that includes the wall-clock start time of the clip
        let ts = 'clip';
        if (playbackStartTime) {
            const clipWall = new Date(Number(playbackStartTime) + _clipStartVideo * 1000);
            ts = 'clip_' + clipWall.getFullYear() + '-' +
                 String(clipWall.getMonth()+1).padStart(2,'0') + '-' +
                 String(clipWall.getDate()).padStart(2,'0') + '_' +
                 String(clipWall.getHours()).padStart(2,'0') +
                 String(clipWall.getMinutes()).padStart(2,'0') +
                 String(clipWall.getSeconds()).padStart(2,'0');
        }

        const blob = new Blob(_clipChunks, { type: mimeBase });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href     = url;
        a.download = ts + '.' + ext;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 10000);

        // Reset button back to ready state
        const btn = document.getElementById('record-btn');
        const lbl = document.getElementById('record-btn-label');
        btn.className = 'ready';
        lbl.textContent = 'Rec';
        _clipRecorder = null;
    }

    function seekFrame(direction) {

        video.pause();
        const frameDuration = 1 / 30; // approximate single frame step
        const nextTime = Math.max(0, Math.min(video.duration || Infinity, video.currentTime + direction * frameDuration));
        video.currentTime = nextTime;
    }

    async function startPlayback() { // returns Promise; caller switches to video tab
        recordedChunks = [];
        setDownloadBtn('hidden');

        try {
            playbackStartTime=new Date(Number(videosToAppend[0].split("!")[1])-Number(videosToAppend[0].split("!")[2].split(".")[0]))
            document.getElementById('videodesc').innerHTML=": "+videosToAppend[0].split("!")[0]+" from "+playbackStartTime.getDate()+"/"+(playbackStartTime.getMonth()+1)+"/"+playbackStartTime.getFullYear()+" "+String(playbackStartTime.getHours()).padStart(2,"0")+":"+String(playbackStartTime.getMinutes()).padStart(2,"0")
        } catch (e) {

        }
        try {timeline.removeCustomTime()} catch(e){}
		timeline.addCustomTime(playbackStartTime)

		const firstFilename = videosToAppend.shift();
        const firstFile = await fetchVideoFile(firstFilename);
        const mi = await MediaInfo.mediaInfoFactory({locateFile:(path,prefix)=>{return '/MediaInfoModule.wasm'}});
        const readChunk = async (chunkSize, offset) => firstFile.slice(offset, offset + chunkSize)
        const result = await mi.analyzeData(firstFile.byteLength, readChunk)
        const mime = getMimeTypeAndCodecs(result);
       
        const mediaSource = new MediaSource();
        document.getElementById('player').src = URL.createObjectURL(mediaSource);
        setDownloadBtn('buffering');
		
        mediaSource.addEventListener('sourceopen', async () => {
            const sourceBuffer = mediaSource.addSourceBuffer(mime);
            sourceBuffer.mode = 'segments';

            // Track whether all chunks (including queued ones) have been appended
            let remainingAtStart = videosToAppend.length + 1; // +1 for firstFile
            let appended = 0;

            // Start time of the first file — defines t=0 in the MSE timeline
            const firstFileStartTime = Number(firstFilename.split('!')[1]) - Number(firstFilename.split('!')[2].split('.')[0]);

            // Returns the MSE timestampOffset (seconds) for a given filename
            function mseOffsetForFile(filename) {
                try {
                    const fileStartTime = Number(filename.split('!')[1]) - Number(filename.split('!')[2].split('.')[0]);
                    return (fileStartTime - firstFileStartTime) / 1000;
                } catch(e) {
                    return 0;
                }
            }


            function onChunkAppended(chunk) {
                recordedChunks.push(chunk);
                appended++;
                if (appended >= remainingAtStart) {
                    setDownloadBtn('ready');
                }
            }

            appendNext = async () => {
                if (!sourceBuffer.updating) {
                    if (videosToAppend.length <= 0) {
                        if (mediaSource.readyState !== 'ended') {
                            mediaSource.endOfStream();
                        }
                        return;
                    }
                    const filename = videosToAppend.shift();
                    const chunk = await fetchVideoFile(filename);
                    onChunkAppended(chunk);
                    sourceBuffer.timestampOffset = mseOffsetForFile(filename);
                    sourceBuffer.appendBuffer(chunk);
                }
            }
            sourceBuffer.addEventListener('updateend', appendNext);
            sourceBuffer.timestampOffset = 0; // First file always starts at t=0
            onChunkAppended(firstFile);
            sourceBuffer.appendBuffer(firstFile);
        });
    }
    document.getElementById('player').addEventListener('waiting',(e)=>{
        //Sometimes end up with small gaps in the buffer, so if we are waiting, try skipping forward up to 1s in 5ms steps
        let totalSkipped = 0;
		console.log('Encountered buffering in video at '+document.getElementById('player').currentTime+'. Skipping to keep playing');
        

        function skipFwd() {
            if (!document.getElementById('player').paused && !document.getElementById('player').seeking && document.getElementById('player').readyState >= 3) {
                // Video is no longer buffering
                console.log('Playback resumed at '+document.getElementById('player').currentTime+'.');
                return;
            }

            if (totalSkipped >= 1) {
                console.warn('Max skip time reached. Still buffering.');
                return;
            }

            document.getElementById('player').currentTime += 0.020;
            totalSkipped += 0.020;
            
            // Wait a bit and try again
            setTimeout(skipFwd, 20); // check every 20ms
        }

        skipFwd();
    })
//Display QR codes

    // Hide modal
    function hideImageModal() {
        const modal = document.getElementById('imageModal');
        modal.style.display = 'none';
    }

    // Close modal when clicking anywhere on the overlay
    document.getElementById('imageModal').addEventListener('click', hideImageModal);

    // ── Tab switching ─────────────────────────────────────────────────────────

    function switchTab(name) {
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('pane-' + name).classList.add('active');
        document.querySelectorAll('.tab-btn').forEach(b => {
            if (name === 'video' && b.textContent.toLowerCase().includes('video')) b.classList.add('active');
            if (name === 'scores' && b.textContent.toLowerCase().includes('score')) b.classList.add('active');
        });
    }

    // ── Event table ───────────────────────────────────────────────────────────

    function formatTime(ms) {
        const d = new Date(ms);
        const now = new Date();

        const time = d.toLocaleTimeString('en-GB'); // hh:mm:ss

        const isToday = d.toDateString() === now.toDateString();
        if (isToday) return time;

        const dateStr = d.toLocaleDateString('en-GB', {
            day: 'numeric',
            month: 'short',
            year: '2-digit'
        }); // e.g. "6 Mar 25"

        return `${time} ${dateStr}`;
    }

    function apparatusClass(app) {
        if (!app) return '';
        const a = app.toLowerCase();
        if (a.includes('vault'))  return 'app-vault';
        if (a.includes('bars'))    return 'app-bars';
        if (a.includes('beam'))   return 'app-beam';
        if (a.includes('floor'))  return 'app-floor';
        return '';
    }
    // recentScores holds all rows as objects so we can re-render without a full fetch
    var recentScores = [];
    function renderScoresTable() {
        const tbody = document.getElementById('score-table-body');
        if (recentScores.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" style="color:#888;font-style:italic">No scores yet</td></tr>';
            return;
        }
        //Remove duplicates (same id) that can occur when the same score is received via WebSocket and fetched via API at the same time, keeping the most recent one
        recentScores.sort((a,b)=>b.time_score - a.time_score) // Sort by most recent score
        const seenRoutines = new Set();
        recentScores = recentScores.filter(m => {
            if (seenRoutines.has(m.competitor+"|"+m.apparatus+"|"+m.server)) return false;
            seenRoutines.add(m.competitor+"|"+m.apparatus+"|"+m.server);
            return true;
        });

        tbody.innerHTML = recentScores.map(m => {
            const finalStr = m.final_score != null && m.final_score !== '' ? Number(m.final_score).toFixed(3) : '';
            const dStr     = m.d != null && m.d !== '' ? Number(m.d).toFixed(1) : '';
            const eStr     = m.e != null && m.e !== '' ? Number(m.e).toFixed(3) : '';
            const ndStr    = m.nd != null && m.nd !== '' ? Number(m.nd).toFixed(1) : '';
            return `<tr id='score-${m.id}' class='${apparatusClass(m.apparatus)}' onclick="zoomToItem(${m.id})">
                <td>${m.apparatus || ''}</td>
                <td>${m.competitor ?? ''}</td>
                <td>${m.name || ''}${m.club ? ' (' + m.club + ')' : ''}</td>
                <td>${dStr}</td>
                <td>${eStr}</td>
                <td>${ndStr}</td>
                <td>${finalStr}</td>
                <td>${formatTime(m.time_score)}</td>
                <td id='video-${m.id}'></td>
            </tr>`;
        }).join('');

        // Also update timeline item tooltips for items that have scores
        recentScores.forEach(m => {
            const item = items.get(m.id);
            if (!item) return;
            const dStr     = m.d != null && m.d !== '' ? Number(m.d).toFixed(1) : '—';
            const eStr     = m.e != null && m.e !== '' ? Number(m.e).toFixed(3) : '—';
            const ndStr    = m.nd != null && m.nd !== '' ? Number(m.nd).toFixed(1) : '—';
            const finalStr = m.final_score != null && m.final_score !== '' ? Number(m.final_score).toFixed(3) : '—';
            const scoreTooltip = `<small>${m.competitor}<br />${m.club}<br />${m.name}<br /><b>${m.apparatus}</b><br />D:${dStr} E:${eStr} ND:${ndStr}<br />Final: <b>${finalStr}</b></small>`;
            items.update({ id: m.id, title: scoreTooltip, content: item.content });
        });
    }
    function clearScoreHighlights() {
        document.querySelectorAll('#score-table tr.score-highlight').forEach(r => r.classList.remove('score-highlight'));
    }

    function highlightScore(id) {
        clearScoreHighlights();
        // Switch to scores tab
        switchTab('scores');
        const row = document.getElementById('score-' + id);
        if (row) {
            row.classList.add('score-highlight');
            row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    }
    // Populate table from the eventlist API (called by refreshVideos already)
    function refreshScoresTable() {
        fetch('/scorelist')
            .then(r => r.json())
            .then(data => {
                recentScores=data
                renderScoresTable()
            })
            .catch(() => {});
    }
    refreshScoresTable();
    document.getElementById('score-table').addEventListener('click', function() {
        clearScoreHighlights();
    });

    // ── WebSocket – live event updates ────────────────────────────────────────
    //
    // The server broadcasts JSON status messages on /ws whenever a UDP
    // message is received from a keypad or iPad controller.
    //
    // Message shape:
    // {
    //   server:     "192.168.1.x",   // source IP
    //   status:     "competing" | "stopped" | "scoring" | "ready",
    //   apparatus:  "Vault" | "Bars" | "Beam" | "Floor",
    //   competitor: "42",
    //   firstName:  "Jane",
    //   surname:    "Doe",
    //   club:       "TST",
    //   time:       1718000000000    // Unix ms
    // }

    (function connectWebSocket() {
        const ws = new WebSocket((window.location.protocol=="https:"?'wss://':'ws://') + location.host + '/ws'); 

        ws.addEventListener('open', () => {
            console.log('WebSocket connected');
        });

        ws.addEventListener('message', (event) => {
            let msg;
            try { msg = JSON.parse(event.data); } catch(e) { return; }
            if (msg.status=='newVideo' || msg.type === 'newVideo' || msg.file) {
                addVideoItemsToTimeline([msg.file]);
            }
            if (msg.time_score) {
                // Append to live scores table
                recentScores.unshift(msg);
                renderScoresTable();
            }
            // Also add to the vis timeline without a full reload
            const wsServer = msg.server || 'unknown';
            const wsGroupId = 'E|' + wsServer + '|' + msg.apparatus;
            try {
                groups.add({
                    id: wsGroupId,
                    content: msg.apparatus + ' <span style="font-size:80%;opacity:0.6">' + wsServer + '</span>',
                    className: 'event-group',
                    subgroupStack: true
                });
            } catch(e) { /* duplicate – ignore */ }
            try {
                const dStr     = msg.d != null && msg.d !== '' ? Number(msg.d).toFixed(1) : '—';
                const eStr     = msg.e != null && msg.e !== '' ? Number(msg.e).toFixed(3) : '—';
                const ndStr    = msg.nd != null && msg.nd !== '' ? Number(msg.nd).toFixed(1) : '—';
                const finalStr = msg.final_score != null && msg.final_score !== '' ? Number(msg.final_score).toFixed(3) : null;
                const scoreInfo = finalStr !== null ? `<br />D:${dStr} E:${eStr} ND:${ndStr}<br />Final: <b>${finalStr}</b>` : '';
                items.update({
                    id: msg.id,
                    group: wsGroupId,
                    start: msg.time_start,
                    end: (msg.time_stop ? msg.time_stop : undefined),
                    type: (msg.time_stop - msg.time_start > 0 ? 'range' : 'point'),
                    className: 'event-item',
                    content: msg.competitor + ' · ' + msg.club + ' · ' + msg.name,
                    title: '<small>' + msg.competitor + '<br />' + msg.club + '<br />' + msg.name + scoreInfo + '</small>'
                });
            } catch(e) {            }
        })
        
        ws.addEventListener('close', () => {
            console.log('WebSocket closed – reconnecting in 3 s');
            setTimeout(connectWebSocket, 3000);
        });

        ws.addEventListener('error', (e) => {
            console.warn('WebSocket error', e);
            ws.close();
        });
    })();

</script>
